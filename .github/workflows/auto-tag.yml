name: Auto Tag

on:
  push:
    branches:
      - main

jobs:
  tag:
    name: Tag version if changed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN does not trigger other
          # workflows (GitHub's anti-recursion rule), so release.yml's
          # `push: tags: v*` never fires. RELEASE_PAT (repo secret, a PAT with
          # Contents: write) makes the push look like a normal user push.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Tag new version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Pushed tag $TAG"
          fi
